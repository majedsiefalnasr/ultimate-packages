name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        run: pnpm run audit:validate

      - name: License scan
        run: pnpm run license:validate

      - name: Install-script policy check
        run: pnpm run install-script-policy:validate

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Validate generated artifacts
        run: pnpm run validate

      - name: Test
        run: pnpm run test

      - name: Determine affected packages
        id: affected
        run: pnpm run affected:packages -- --base-ref origin/main

      - name: Pack/install integrity (affected)
        run: |
          for pkg in ${{ steps.affected.outputs.packages }}; do
            echo "::group::integrity:pack-install $pkg"
            pnpm run integrity:pack-install -- "$pkg"
            echo "::endgroup::"
          done

      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: CodeQL analyze
        id: codeql-analyze
        uses: github/codeql-action/analyze@v3

      - name: Resolve SARIF path
        run: echo "SARIF_PATH=${{ steps.codeql-analyze.outputs.sarif-output }}/javascript-typescript.sarif" >> "$GITHUB_ENV"

      - name: SAST baseline validation
        run: pnpm run sast:validate -- "$SARIF_PATH"

      - name: Bundle-size measurement
        run: pnpm run size:measure

      - name: Bundle-size regression check
        run: pnpm run size:validate -- --base-ref origin/main

      - name: Coverage measurement
        run: pnpm run coverage:measure

      - name: Coverage regression check
        run: pnpm run coverage:validate -- --base-ref origin/main

      - name: Provenance scripts self-tests
        run: pnpm run test:scripts

      - name: Provenance validation
        run: pnpm run provenance:validate -- --base-ref origin/main

      - name: Package boundary validation
        run: pnpm run boundary:validate

      - name: Prime dependency-ceiling validation
        run: pnpm run ceiling:validate

      - name: Compatibility manifest validation
        run: pnpm run compatibility-manifest:validate

      - name: CLI package boundary validation
        run: pnpm run boundary:validate:cli

      - name: MCP package boundary validation
        run: pnpm run boundary:validate:mcp

      - name: AI package boundary validation
        run: pnpm run boundary:validate:ai
