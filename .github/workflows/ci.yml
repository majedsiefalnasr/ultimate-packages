name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to a pull request cancels that PR's older run. Push runs are
# keyed by ref and SHA, so they are never cancelled (ADR-070, CO-3).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      BASE: ${{ github.base_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Classify changes
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/provenance/classify-changes.mjs --base-ref "origin/$BASE" --event "$EVENT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        if: ${{ !cancelled() }}
        run: pnpm run audit:validate

      - name: License scan
        if: ${{ !cancelled() }}
        run: pnpm run license:validate

      - name: Install-script policy check
        if: ${{ !cancelled() }}
        run: pnpm run install-script-policy:validate

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm run lint

      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm run format:check

      - name: Build
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        run: pnpm run build

      - name: Typecheck
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        run: pnpm run typecheck

      - name: Validate generated artifacts
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        run: pnpm run validate

      - name: Metadata API drift check
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        run: |
          status=0
          pnpm --filter @ultimate/component-metadata run drift:check || status=1
          pnpm --filter @ultimate/component-metadata run docs:generate -- --check || status=1
          exit "$status"

      - name: Metadata coverage report
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        run: pnpm --filter @ultimate/component-metadata run coverage:report

      - name: Test
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        run: pnpm run test

      - name: Determine affected packages
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        id: affected
        run: pnpm run affected:packages -- --base-ref "origin/$BASE"

      - name: Pack/install integrity (affected)
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        env:
          AFFECTED_PACKAGES: ${{ steps.affected.outputs.packages }}
        run: |
          for pkg in $AFFECTED_PACKAGES; do
            echo "::group::integrity:pack-install $pkg"
            pnpm run integrity:pack-install -- "$pkg"
            echo "::endgroup::"
          done

      - name: Installed-package smoke (CLI/MCP)
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        run: pnpm run smoke:installed

      - name: CodeQL init
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: CodeQL analyze
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        id: codeql-analyze
        uses: github/codeql-action/analyze@v3

      - name: Resolve SARIF path
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        env:
          SARIF_OUTPUT_DIR: ${{ steps.codeql-analyze.outputs.sarif-output }}
        run: |
          if [ -z "$SARIF_OUTPUT_DIR" ]; then
            echo "::error::CodeQL sarif-output directory is empty"
            exit 1
          fi
          SARIF_PATH="$SARIF_OUTPUT_DIR/javascript.sarif"
          if [ ! -f "$SARIF_PATH" ]; then
            echo "::error::CodeQL SARIF file not found at $SARIF_PATH"
            exit 1
          fi
          printf 'SARIF_PATH=%s\n' "$SARIF_PATH" >> "$GITHUB_ENV"
          echo "Resolved CodeQL SARIF: $SARIF_PATH"

      - name: SAST baseline validation
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        run: pnpm run sast:validate -- "$SARIF_PATH"

      - name: Fetch pinned vendor archives
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        run: pnpm run vendor:fetch -- primereact primevue

      - name: Provenance scripts self-tests
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        run: pnpm run test:scripts

      - name: Package boundary validation
        if: ${{ !cancelled() }}
        run: pnpm run boundary:validate

      - name: Prime dependency-ceiling validation
        if: ${{ !cancelled() }}
        run: pnpm run ceiling:validate

      - name: Compatibility manifest validation
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs' }}
        run: pnpm run compatibility-manifest:validate

      - name: CLI package boundary validation
        if: ${{ !cancelled() }}
        run: pnpm run boundary:validate:cli

      - name: MCP package boundary validation
        if: ${{ !cancelled() }}
        run: pnpm run boundary:validate:mcp

      - name: AI package boundary validation
        if: ${{ !cancelled() }}
        run: pnpm run boundary:validate:ai

      - name: AGENTS.md pointer validation
        if: ${{ !cancelled() }}
        run: pnpm run agents-md-pointers:validate

  # Not a required check (ADR-068). It runs the slow baseline checks and the
  # checks with known failures, so the CI workflow result can be red while the
  # required `ci` check is green. Known failures: Provenance validation
  # (GAP-094, missing manifest entries) and Bundle-size regression check
  # (`component-metadata` exceeds its PERFORMANCE.md baseline).
  ci-extended:
    name: "Baselines (advisory): size, coverage, provenance"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BASE: ${{ github.base_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm run build

      - name: Bundle-size measurement
        if: ${{ !cancelled() }}
        run: pnpm run size:measure

      - name: Bundle-size regression check
        if: ${{ !cancelled() }}
        run: pnpm run size:validate -- --base-ref "origin/$BASE"

      - name: Coverage measurement
        if: ${{ !cancelled() }}
        run: pnpm run coverage:measure

      - name: Coverage regression check
        if: ${{ !cancelled() }}
        run: pnpm run coverage:validate -- --base-ref "origin/$BASE"

      - name: Provenance validation
        if: ${{ !cancelled() }}
        run: pnpm run provenance:validate -- --base-ref "origin/$BASE"
