name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        if: ${{ !cancelled() }}
        run: pnpm run audit:validate

      - name: License scan
        if: ${{ !cancelled() }}
        run: pnpm run license:validate

      - name: Install-script policy check
        if: ${{ !cancelled() }}
        run: pnpm run install-script-policy:validate

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm run lint

      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm run format:check

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm run build

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm run typecheck

      - name: Validate generated artifacts
        if: ${{ !cancelled() }}
        run: pnpm run validate

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm run test

      - name: Determine affected packages
        if: ${{ !cancelled() }}
        id: affected
        run: pnpm run affected:packages -- --base-ref origin/main

      - name: Pack/install integrity (affected)
        if: ${{ !cancelled() }}
        env:
          AFFECTED_PACKAGES: ${{ steps.affected.outputs.packages }}
        run: |
          for pkg in $AFFECTED_PACKAGES; do
            echo "::group::integrity:pack-install $pkg"
            pnpm run integrity:pack-install -- "$pkg"
            echo "::endgroup::"
          done

      - name: CodeQL init
        if: ${{ !cancelled() }}
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: CodeQL analyze
        if: ${{ !cancelled() }}
        id: codeql-analyze
        uses: github/codeql-action/analyze@v3

      - name: Resolve SARIF path
        if: ${{ !cancelled() }}
        env:
          SARIF_OUTPUT_DIR: ${{ steps.codeql-analyze.outputs.sarif-output }}
        run: echo "SARIF_PATH=$SARIF_OUTPUT_DIR/javascript-typescript.sarif" >> "$GITHUB_ENV"

      - name: SAST baseline validation
        if: ${{ !cancelled() }}
        run: pnpm run sast:validate -- "$SARIF_PATH"

      - name: Bundle-size measurement
        if: ${{ !cancelled() }}
        run: pnpm run size:measure

      - name: Bundle-size regression check
        if: ${{ !cancelled() }}
        run: pnpm run size:validate

      - name: Coverage measurement
        if: ${{ !cancelled() }}
        run: pnpm run coverage:measure

      - name: Coverage regression check
        if: ${{ !cancelled() }}
        run: pnpm run coverage:validate

      - name: Provenance scripts self-tests
        if: ${{ !cancelled() }}
        run: pnpm run test:scripts

      - name: Provenance validation
        if: ${{ !cancelled() }}
        run: pnpm run provenance:validate -- --base-ref origin/main

      - name: Package boundary validation
        if: ${{ !cancelled() }}
        run: pnpm run boundary:validate

      - name: Prime dependency-ceiling validation
        if: ${{ !cancelled() }}
        run: pnpm run ceiling:validate

      - name: Compatibility manifest validation
        if: ${{ !cancelled() }}
        run: pnpm run compatibility-manifest:validate

      - name: CLI package boundary validation
        if: ${{ !cancelled() }}
        run: pnpm run boundary:validate:cli

      - name: MCP package boundary validation
        if: ${{ !cancelled() }}
        run: pnpm run boundary:validate:mcp

      - name: AI package boundary validation
        if: ${{ !cancelled() }}
        run: pnpm run boundary:validate:ai

      - name: AGENTS.md pointer validation
        if: ${{ !cancelled() }}
        run: pnpm run agents-md-pointers:validate

  # Screenshot baselines and CI visual execution use the same pinned
  # Playwright image and the same CPU architecture (arm64); see
  # docs/superpowers/specs/2026-10-05-ci-visual-environment-design.md.
  track-a-browser-visual-a11y:
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        framework: [ng, react, vue]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build

      # The G3-A verification specs run in their own steps below (GAP-064
      # G3-A Spec §14); the strict baseline contract covers every other spec.
      - name: Run Playwright projects (${{ matrix.framework }})
        run: |
          npx playwright test \
            --project=${{ matrix.framework }}-chromium \
            --project=${{ matrix.framework }}-firefox \
            --project=${{ matrix.framework }}-webkit \
            --grep-invert "G3-A|G3-B|G3-C1"

      - name: Accessibility baseline validation (${{ matrix.framework }})
        run: node scripts/provenance/validate-accessibility-baseline.mjs --check "test-results/accessibility/${{ matrix.framework }}/**/*.json"

      - name: Upload accessibility reports (${{ matrix.framework }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports-${{ matrix.framework }}
          path: test-results/accessibility/${{ matrix.framework }}/

      - name: Upload Playwright HTML report (${{ matrix.framework }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.framework }}
          path: playwright-report/

      # GAP-064 G3-A Spec §14: differential accessibility contract for the
      # G3-A verification stories (introduced violations must be baselined;
      # pre-existing ones are evidence-listed, never baselined). The visual
      # tests in this run stay a hard gate.
      - name: Run G3-A verification specs (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' }}
        run: |
          npx playwright test packages/${{ matrix.framework }}/e2e/g3a-aura-styles.spec.ts \
            --project=${{ matrix.framework }}-chromium \
            --project=${{ matrix.framework }}-firefox \
            --project=${{ matrix.framework }}-webkit

      - name: G3-A differential accessibility validation (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' }}
        # An explicit bash shell adds pipefail, so the validator's exit code
        # survives the pipe into tee.
        shell: bash
        run: |
          mkdir -p test-results/g3a-accessibility
          node scripts/provenance/validate-g3a-accessibility.mjs ${{ matrix.framework }} 2>&1 \
            | tee test-results/g3a-accessibility/${{ matrix.framework }}-validation.txt

      - name: Upload G3-A accessibility reports (${{ matrix.framework }})
        if: ${{ always() && matrix.framework != 'react' }}
        uses: actions/upload-artifact@v4
        with:
          name: g3a-accessibility-reports-${{ matrix.framework }}
          path: |
            test-results/accessibility/${{ matrix.framework }}/
            test-results/g3a-accessibility/

      # GAP-064 G3-B Spec §9: differential accessibility contract for the G3-B
      # verification stories (same contract as G3-A, own story set and evidence
      # list). The visual and layout tests in this run stay a hard gate.
      - name: Run G3-B verification specs (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' }}
        run: |
          npx playwright test packages/${{ matrix.framework }}/e2e/g3b-aura-styles.spec.ts \
            --project=${{ matrix.framework }}-chromium \
            --project=${{ matrix.framework }}-firefox \
            --project=${{ matrix.framework }}-webkit

      - name: G3-B differential accessibility validation (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' }}
        # An explicit bash shell adds pipefail, so the validator's exit code
        # survives the pipe into tee.
        shell: bash
        run: |
          mkdir -p test-results/g3b-accessibility
          node scripts/provenance/validate-g3b-accessibility.mjs ${{ matrix.framework }} 2>&1 \
            | tee test-results/g3b-accessibility/${{ matrix.framework }}-validation.txt

      - name: Upload G3-B accessibility reports (${{ matrix.framework }})
        if: ${{ always() && matrix.framework != 'react' }}
        uses: actions/upload-artifact@v4
        with:
          name: g3b-accessibility-reports-${{ matrix.framework }}
          path: |
            test-results/accessibility/${{ matrix.framework }}/
            test-results/g3b-accessibility/

      # GAP-064 G3-C1 Spec §10 (SR-C1-2): differential accessibility contract for
      # the G3-C1 verification stories (same contract as G3-A/G3-B, own story set
      # and evidence list). The visual and layout tests in this run stay a hard gate.
      - name: Run G3-C1 verification specs (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' }}
        run: |
          npx playwright test packages/${{ matrix.framework }}/e2e/g3c1-aura-styles.spec.ts \
            --project=${{ matrix.framework }}-chromium \
            --project=${{ matrix.framework }}-firefox \
            --project=${{ matrix.framework }}-webkit

      - name: G3-C1 differential accessibility validation (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' }}
        # An explicit bash shell adds pipefail, so the validator's exit code
        # survives the pipe into tee.
        shell: bash
        run: |
          mkdir -p test-results/g3c1-accessibility
          node scripts/provenance/validate-g3c1-accessibility.mjs ${{ matrix.framework }} 2>&1 \
            | tee test-results/g3c1-accessibility/${{ matrix.framework }}-validation.txt

      - name: Upload G3-C1 accessibility reports (${{ matrix.framework }})
        if: ${{ always() && matrix.framework != 'react' }}
        uses: actions/upload-artifact@v4
        with:
          name: g3c1-accessibility-reports-${{ matrix.framework }}
          path: |
            test-results/accessibility/${{ matrix.framework }}/
            test-results/g3c1-accessibility/

  track-e-ssr-hydration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: ng
            dir: playground-angular
          - framework: react
            dir: playground-react
          - framework: vue
            dir: playground-vue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build harness and its workspace dependencies (${{ matrix.dir }})
        run: pnpm --filter-prod "${{ matrix.dir }}..." run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright SSR project (${{ matrix.framework }})
        env:
          TRACK_E_SSR_FRAMEWORK: ${{ matrix.framework }}
        run: npx playwright test --project=${{ matrix.framework }}-ssr-chromium

      - name: Upload Playwright HTML report (${{ matrix.framework }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ssr-${{ matrix.framework }}
          path: playwright-report/
