# Playwright browser, visual, accessibility and SSR jobs, moved unchanged from
# ci.yml (ADR-068). They are not required checks, and the required `ci` check
# holds only the fast checks. With track-a sharded (ADR-071), a full run's
# longest job took about 10 minutes when measured on 2026-10-20. On a pull
# request into develop, track-a and SSR run only the frameworks the change can
# affect; on a push or a pull request into main they run all three (ADR-069,
# ADR-070).
name: Browser

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to a pull request cancels that PR's older run. Push runs are
# keyed by ref and SHA, so they are never cancelled (ADR-070, CO-3).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which frameworks' track-a and SSR jobs run (ADR-069, ADR-070): only
  # the affected frameworks on a pull request, all three on a push or when unsure.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BASE: ${{ github.base_ref || github.ref_name }}
    outputs:
      frameworks: ${{ steps.classify.outputs.frameworks }}
      track_a: ${{ steps.classify.outputs.track_a }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Classify changes
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/provenance/classify-changes.mjs --base-ref "origin/$BASE" --event "$EVENT"

  # Screenshot baselines and CI visual execution use the same pinned
  # Playwright image and the same CPU architecture (arm64).
  #
  # Check names read `Playwright visual + a11y (<framework>, <shard>)`. The job
  # name has no expression on purpose: a name that uses the matrix renders raw
  # (for example `matrix.label`) when the job is skipped, so the skipped check
  # keeps its plain name. The shard decides which suites a job runs (ADR-071;
  # each suite's run, validation and upload steps share a shard):
  #
  #   shard  ng and vue                                  react
  #   1      strict suite + its accessibility baseline   strict suite + its
  #          validation and uploads; G3-C2               validation and
  #                                                      uploads; W1
  #   2      G3-A; G3-D                                  -
  #   3      G3-B; G3-C1; G3-E                           -
  #
  # The matrix (framework and shard) comes from scripts/provenance/classify-changes.mjs
  # (TRACK_A_SHARDS); the `matrix.shard == N` conditions on the steps below are
  # the source of this table.
  track-a-browser-visual-a11y:
    name: Playwright visual + a11y
    needs: changes
    if: needs.changes.outputs.frameworks != '[]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    # Each job starts only its own framework's Storybook server (ADR-070, CO-7).
    env:
      TRACK_A_FRAMEWORK: ${{ matrix.framework }}
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --user 1001
    strategy:
      fail-fast: false
      # ADR-071 (CO-8): ng and vue run as three shards each, react as one;
      # the classifier decides the matrix.
      matrix: ${{ fromJSON(needs.changes.outputs.track_a) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      # ADR-070 (CO-1): files on the closed NON_BROWSER_PATHS list are deleted
      # before anything runs, so no browser result can depend on them.
      - name: Remove non-browser inputs
        run: node scripts/provenance/classify-changes.mjs --remove-non-browser-paths

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR-070 (CO-1, Spec Amendment A1): packages in no framework closure are
      # emptied, keeping a script-less package.json, before anything is built,
      # so no build output or browser result can depend on them.
      - name: Remove packages outside the framework closures
        run: node scripts/provenance/classify-changes.mjs --remove-out-of-closure-packages

      - name: Build workspace packages
        run: pnpm run build

      # The G3-A verification specs run in their own steps below (GAP-064
      # G3-A Spec §14); the strict baseline contract covers every other spec.
      - name: Run Playwright projects (${{ matrix.framework }})
        if: ${{ matrix.shard == 1 }}
        run: |
          npx playwright test \
            --project=${{ matrix.framework }}-chromium \
            --project=${{ matrix.framework }}-firefox \
            --project=${{ matrix.framework }}-webkit \
            --grep-invert "G3-A|G3-B|G3-C1|G3-C2|G3-D|G3-E|W1|W2"

      - name: Accessibility baseline validation (${{ matrix.framework }})
        if: ${{ matrix.shard == 1 }}
        run: node scripts/provenance/validate-accessibility-baseline.mjs --check "test-results/accessibility/${{ matrix.framework }}/**/*.json"

      - name: Upload accessibility reports (${{ matrix.framework }})
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports-${{ matrix.framework }}
          path: test-results/accessibility/${{ matrix.framework }}/

      - name: Upload Playwright HTML report (${{ matrix.framework }})
        if: ${{ always() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.framework }}
          path: playwright-report/

      # GAP-064 G3-A Spec §14: differential accessibility contract for the
      # G3-A verification stories (introduced violations must be baselined;
      # pre-existing ones are evidence-listed, never baselined). The visual
      # tests in this run stay a hard gate.
      - name: Run G3-A verification specs (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' && matrix.shard == 2 }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-tranches/g3a
        run: |
          npx playwright test packages/${{ matrix.framework }}/e2e/g3a-aura-styles.spec.ts \
            --project=${{ matrix.framework }}-chromium \
            --project=${{ matrix.framework }}-firefox \
            --project=${{ matrix.framework }}-webkit

      - name: G3-A differential accessibility validation (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' && matrix.shard == 2 }}
        # An explicit bash shell adds pipefail, so the validator's exit code
        # survives the pipe into tee.
        shell: bash
        run: |
          mkdir -p test-results/g3a-accessibility
          node scripts/provenance/validate-g3a-accessibility.mjs ${{ matrix.framework }} 2>&1 \
            | tee test-results/g3a-accessibility/${{ matrix.framework }}-validation.txt

      - name: Upload G3-A accessibility reports (${{ matrix.framework }})
        if: ${{ always() && matrix.framework != 'react' && matrix.shard == 2 }}
        uses: actions/upload-artifact@v4
        with:
          name: g3a-accessibility-reports-${{ matrix.framework }}
          path: |
            test-results/accessibility/${{ matrix.framework }}/
            test-results/g3a-accessibility/

      # GAP-064 G3-B Spec §9: differential accessibility contract for the G3-B
      # verification stories (same contract as G3-A, own story set and evidence
      # list). The visual and layout tests in this run stay a hard gate.
      - name: Run G3-B verification specs (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' && matrix.shard == 3 }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-tranches/g3b
        run: |
          npx playwright test packages/${{ matrix.framework }}/e2e/g3b-aura-styles.spec.ts \
            --project=${{ matrix.framework }}-chromium \
            --project=${{ matrix.framework }}-firefox \
            --project=${{ matrix.framework }}-webkit

      - name: G3-B differential accessibility validation (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' && matrix.shard == 3 }}
        # An explicit bash shell adds pipefail, so the validator's exit code
        # survives the pipe into tee.
        shell: bash
        run: |
          mkdir -p test-results/g3b-accessibility
          node scripts/provenance/validate-g3b-accessibility.mjs ${{ matrix.framework }} 2>&1 \
            | tee test-results/g3b-accessibility/${{ matrix.framework }}-validation.txt

      - name: Upload G3-B accessibility reports (${{ matrix.framework }})
        if: ${{ always() && matrix.framework != 'react' && matrix.shard == 3 }}
        uses: actions/upload-artifact@v4
        with:
          name: g3b-accessibility-reports-${{ matrix.framework }}
          path: |
            test-results/accessibility/${{ matrix.framework }}/
            test-results/g3b-accessibility/

      # GAP-064 G3-C1 Spec §10 (SR-C1-2): differential accessibility contract for
      # the G3-C1 verification stories (same contract as G3-A/G3-B, own story set
      # and evidence list). The visual and layout tests in this run stay a hard gate.
      - name: Run G3-C1 verification specs (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' && matrix.shard == 3 }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-tranches/g3c1
        run: |
          npx playwright test packages/${{ matrix.framework }}/e2e/g3c1-aura-styles.spec.ts \
            --project=${{ matrix.framework }}-chromium \
            --project=${{ matrix.framework }}-firefox \
            --project=${{ matrix.framework }}-webkit

      - name: G3-C1 differential accessibility validation (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' && matrix.shard == 3 }}
        # An explicit bash shell adds pipefail, so the validator's exit code
        # survives the pipe into tee.
        shell: bash
        run: |
          mkdir -p test-results/g3c1-accessibility
          node scripts/provenance/validate-g3c1-accessibility.mjs ${{ matrix.framework }} 2>&1 \
            | tee test-results/g3c1-accessibility/${{ matrix.framework }}-validation.txt

      - name: Upload G3-C1 accessibility reports (${{ matrix.framework }})
        if: ${{ always() && matrix.framework != 'react' && matrix.shard == 3 }}
        uses: actions/upload-artifact@v4
        with:
          name: g3c1-accessibility-reports-${{ matrix.framework }}
          path: |
            test-results/accessibility/${{ matrix.framework }}/
            test-results/g3c1-accessibility/

      # GAP-064 G3-C2 Spec §9.5 AC8: differential accessibility contract for
      # the G3-C2 menu stories (same contract as G3-A/G3-B/G3-C1, own story set
      # and evidence list). The visual, open, layout, x3b and reach tests in this run stay a hard gate.
      - name: Run G3-C2 verification specs (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' && matrix.shard == 1 }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-tranches/g3c2
        run: |
          npx playwright test packages/${{ matrix.framework }}/e2e/g3c2-aura-styles.spec.ts \
            --project=${{ matrix.framework }}-chromium \
            --project=${{ matrix.framework }}-firefox \
            --project=${{ matrix.framework }}-webkit

      - name: G3-C2 differential accessibility validation (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' && matrix.shard == 1 }}
        shell: bash
        run: |
          mkdir -p test-results/g3c2-accessibility
          node scripts/provenance/validate-g3c2-accessibility.mjs ${{ matrix.framework }} 2>&1 \
            | tee test-results/g3c2-accessibility/${{ matrix.framework }}-validation.txt

      - name: Upload G3-C2 accessibility reports (${{ matrix.framework }})
        if: ${{ always() && matrix.framework != 'react' && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: g3c2-accessibility-reports-${{ matrix.framework }}
          path: |
            test-results/accessibility/${{ matrix.framework }}/
            test-results/g3c2-accessibility/

      # GAP-064 G3-D Spec §9.5 AC8: differential accessibility contract for
      # the G3-D overlay and composite stories (same contract as G3-A..G3-C2, own story set
      # and evidence list). The visual, open, layout, x3b and reach tests in this run stay a hard gate.
      - name: Run G3-D verification specs (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' && matrix.shard == 2 }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-tranches/g3d
        run: |
          npx playwright test packages/${{ matrix.framework }}/e2e/g3d-aura-styles.spec.ts \
            --project=${{ matrix.framework }}-chromium \
            --project=${{ matrix.framework }}-firefox \
            --project=${{ matrix.framework }}-webkit

      - name: G3-D differential accessibility validation (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' && matrix.shard == 2 }}
        shell: bash
        run: |
          mkdir -p test-results/g3d-accessibility
          node scripts/provenance/validate-g3d-accessibility.mjs ${{ matrix.framework }} 2>&1 \
            | tee test-results/g3d-accessibility/${{ matrix.framework }}-validation.txt

      - name: Upload G3-D accessibility reports (${{ matrix.framework }})
        if: ${{ always() && matrix.framework != 'react' && matrix.shard == 2 }}
        uses: actions/upload-artifact@v4
        with:
          name: g3d-accessibility-reports-${{ matrix.framework }}
          path: |
            test-results/accessibility/${{ matrix.framework }}/
            test-results/g3d-accessibility/

      # GAP-064 G3-E Spec §8 / OI-E3: Ultimate regression evidence for the G3-E verification
      # stories (screenshots, reach, differential accessibility). Not a Prime-parity gate:
      # the Prime comparison harness (tooling/prime-reference) is not run in CI.
      - name: Run G3-E verification specs (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' && matrix.shard == 3 }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-tranches/g3e
        run: |
          npx playwright test packages/${{ matrix.framework }}/e2e/g3e-aura-styles.spec.ts \
            --project=${{ matrix.framework }}-chromium \
            --project=${{ matrix.framework }}-firefox \
            --project=${{ matrix.framework }}-webkit

      - name: G3-E differential accessibility validation (${{ matrix.framework }})
        if: ${{ !cancelled() && matrix.framework != 'react' && matrix.shard == 3 }}
        shell: bash
        run: |
          mkdir -p test-results/g3e-accessibility
          node scripts/provenance/validate-g3e-accessibility.mjs ${{ matrix.framework }} 2>&1 \
            | tee test-results/g3e-accessibility/${{ matrix.framework }}-validation.txt

      - name: Upload G3-E accessibility reports (${{ matrix.framework }})
        if: ${{ always() && matrix.framework != 'react' && matrix.shard == 3 }}
        uses: actions/upload-artifact@v4
        with:
          name: g3e-accessibility-reports-${{ matrix.framework }}
          path: |
            test-results/accessibility/${{ matrix.framework }}/
            test-results/g3e-accessibility/

      # Workstream 1 (ADR-067): React components consume Aura tokens through dt(). Computed-style
      # checks against the Aura values; no accessibility rows, so no validator step.
      - name: Run W1 verification specs (react)
        if: ${{ !cancelled() && matrix.framework == 'react' && matrix.shard == 1 }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-tranches/w1
        run: |
          npx playwright test packages/react/e2e/w1-toolbar.spec.ts \
            --project=react-chromium \
            --project=react-firefox \
            --project=react-webkit

      # One HTML report per tranche invocation (ADR-070, CO-9): each step above
      # writes its own folder, so a failing tranche keeps its report and traces.
      - name: Upload Playwright HTML reports (tranches)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-tranches-${{ matrix.framework }}-${{ matrix.shard }}
          path: playwright-report-tranches/
          if-no-files-found: ignore

  track-e-ssr-hydration:
    name: SSR hydration
    needs: changes
    if: needs.changes.outputs.frameworks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.changes.outputs.frameworks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: "pnpm"

      # ADR-070 (CO-1): files on the closed NON_BROWSER_PATHS list are deleted
      # before anything runs, so no browser result can depend on them.
      - name: Remove non-browser inputs
        run: node scripts/provenance/classify-changes.mjs --remove-non-browser-paths

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR-070 (CO-1, Spec Amendment A1): packages in no framework closure are
      # emptied, keeping a script-less package.json, before anything is built,
      # so no build output or browser result can depend on them.
      - name: Remove packages outside the framework closures
        run: node scripts/provenance/classify-changes.mjs --remove-out-of-closure-packages

      - name: Build harness and its workspace dependencies (${{ matrix.framework == 'ng' && 'playground-angular' || format('playground-{0}', matrix.framework) }})
        run: pnpm --filter-prod "${{ matrix.framework == 'ng' && 'playground-angular' || format('playground-{0}', matrix.framework) }}..." run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright SSR project (${{ matrix.framework }})
        env:
          TRACK_E_SSR_FRAMEWORK: ${{ matrix.framework }}
        run: npx playwright test --project=${{ matrix.framework }}-ssr-chromium

      - name: Upload Playwright HTML report (${{ matrix.framework }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ssr-${{ matrix.framework }}
          path: playwright-report/
